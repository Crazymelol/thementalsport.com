name: Publish Gumroad Products (one-off)

# Temporary helper: publishes the 8 book products on Gumroad via the API
# (PUT /v2/products/:id/enable), since this repo's assistant environment has no
# internet. Token is a masked dispatch input. DELETE after use; revoke token.

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Gumroad access token'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Enable book products
        run: |
          echo "::add-mask::${{ inputs.token }}"
          ids=(
            "YRxy9x9weHjmcdXBTYmW2Q=="
            "_Ui-V3zWs80IOb8gUaGkqw=="
            "05HGjwdGBFKK36VRIL_Qpw=="
            "gjmr9e9Lwk--bAHNIIEnvA=="
            "T8l2l_va3SKt7mMkxNz_ZA=="
            "EcDWZi3S5icT91HEUV6k5w=="
            "q6nVh2eO1GpGJgpxqLk9Kw=="
            "s_L_-7HbEVUwfRgy2jUpMA=="
          )
          for id in "${ids[@]}"; do
            curl -sS -X PUT "https://api.gumroad.com/v2/products/$id/enable" \
              --data-urlencode "access_token=${{ inputs.token }}" -o r.json || echo "curl failed for $id"
            python3 -c "import json; d=json.load(open('r.json')); p=d.get('product') or {}; print('RESULT||', d.get('success'), '||', p.get('name'), '||published=', p.get('published'), '||', d.get('message',''))"
          done
