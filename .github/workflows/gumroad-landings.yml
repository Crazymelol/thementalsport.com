name: Gumroad Landing Pages

# Previews / publishes the custom Gumroad landing pages in gumroad-landings/.
# The sandbox that generates them has no internet, so publishing runs here (GH
# Actions has full internet) via the Gumroad CLI, authenticated with the
# GUMROAD_ACCESS_TOKEN repo secret.
#
# Activate: add secret GUMROAD_ACCESS_TOKEN (Gumroad → Settings → Advanced →
# Applications → generate an access token). Then run this workflow from the
# Actions tab. Leave "only" blank to do all 8 books; set it to one slug (e.g.
# yfkgwv) to do just that product. mode = publish | preview | clear.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Single product slug (blank = all in gumroad-landings/)'
        required: false
        default: ''
      mode:
        description: 'publish | preview | clear'
        required: false
        default: 'publish'

permissions:
  contents: read

concurrency:
  group: gumroad-landings
  cancel-in-progress: false

jobs:
  gumroad:
    runs-on: ubuntu-latest
    env:
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard token
        run: |
          if [ -z "${GUMROAD_ACCESS_TOKEN}" ]; then
            echo "::error::GUMROAD_ACCESS_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions → Secrets, then re-run."
            exit 1
          fi

      - name: Install Gumroad CLI
        run: |
          curl -fsSL https://gumroad.com/install-cli.sh | bash || true
          for d in "$HOME/.gumroad/bin" "$HOME/.local/bin" "/usr/local/bin" "$HOME/bin"; do
            [ -x "$d/gumroad" ] && echo "$d" >> "$GITHUB_PATH"
          done
          if ! command -v gumroad >/dev/null 2>&1; then
            found=$(find "$HOME" /usr/local -name gumroad -type f 2>/dev/null | head -1 || true)
            [ -n "$found" ] && echo "$(dirname "$found")" >> "$GITHUB_PATH"
          fi

      - name: Authenticate
        run: |
          umask 077
          printf '%s' "${GUMROAD_ACCESS_TOKEN}" > "$RUNNER_TEMP/gr_token.txt"
          # The CLI needs an explicit login; the env var alone returns 401.
          # Try stdin redirect first, then as a path argument (CLI variants differ).
          gumroad auth login --with-token < "$RUNNER_TEMP/gr_token.txt" \
            || gumroad auth login --with-token "$RUNNER_TEMP/gr_token.txt" \
            || echo "login command returned nonzero"
          rm -f "$RUNNER_TEMP/gr_token.txt"
          echo "--- auth status ---"
          gumroad auth status --json --no-input --non-interactive || echo "auth status: NOT authenticated"

      - name: Run (${{ github.event.inputs.mode }})
        run: |
          set -u
          MODE="${{ github.event.inputs.mode }}"
          ONLY="${{ github.event.inputs.only }}"

          # Capability probe: what can the CLI actually do (e.g. set a product
          # cover image)? Printed so we build against the real surface, not a guess.
          if [ "$MODE" = "help" ]; then
            echo "::group::gumroad --help"; gumroad --help 2>&1 | head -60; echo "::endgroup::"
            echo "::group::gumroad products --help"; gumroad products --help 2>&1 | head -60; echo "::endgroup::"
            for sub in update edit set cover image upload; do
              echo "::group::gumroad products $sub --help"
              gumroad products "$sub" --help 2>&1 | head -40
              echo "::endgroup::"
            done
            exit 0
          fi

          FILES=$(ls gumroad-landings/*.html)
          [ -n "$ONLY" ] && FILES="gumroad-landings/${ONLY}.html"
          FAIL=0
          for f in $FILES; do
            slug=$(basename "$f" .html)
            echo "::group::${slug} — ${MODE}"
            if [ "$MODE" = "clear" ]; then
              gumroad products page clear "$slug" --yes --json --no-input --non-interactive || FAIL=1
              echo "::endgroup::"; continue
            fi
            echo "--- preview (server sanitizer) ---"
            if gumroad products page preview "$slug" "./$f" --json --no-input --non-interactive > prev.json 2>preverr.txt; then
              jq '{warning, sanitization_report}' prev.json 2>/dev/null || cat prev.json
            else
              FAIL=1; cat preverr.txt; cat prev.json 2>/dev/null || true
            fi
            if [ "$MODE" = "publish" ]; then
              echo "--- publish ---"
              if gumroad products page publish "$slug" "./$f" --json --no-input --non-interactive > pub.json 2>puberr.txt; then
                jq '{warning, sanitization_report}' pub.json 2>/dev/null || cat pub.json
              else
                FAIL=1; cat puberr.txt; cat pub.json 2>/dev/null || true
              fi
              # Use real jq -r so the URL has no surrounding quotes (the CLI's
              # --jq emits a quoted JSON string, which breaks curl).
              url=$(gumroad products page url "$slug" --json --no-input --non-interactive 2>/dev/null | jq -r '.product.landing_url // empty')
              echo "LANDING URL: ${url:-<none>}"
              if [ -n "$url" ]; then
                code=$(curl -sL -o body.html -w "%{http_code}" "$url")
                echo "live HTTP: $code"
                [ "$code" = "200" ] || FAIL=1
                # Gumroad may render the custom page client-side, so the buy
                # marker in the raw HTML is informational, not a pass/fail gate.
                if grep -q 'data-gumroad-action\|gumroad:checkout' body.html 2>/dev/null; then
                  echo "buy marker in raw HTML: yes"
                else
                  echo "buy marker in raw HTML: not in initial HTML (client-rendered)"
                fi
              fi
            fi
            echo "::endgroup::"
          done
          echo "======================================"
          if [ "$FAIL" = "1" ]; then
            echo "::warning::One or more products reported an issue — read the grouped logs above."
          else
            echo "All requested products processed cleanly."
          fi
