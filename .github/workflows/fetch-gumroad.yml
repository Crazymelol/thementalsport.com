name: Fetch Gumroad Products (one-off)

# Temporary helper: reads the Gumroad catalog via the API (this repo's assistant
# environment has no internet). Token is a masked dispatch input. Prints name,
# price, published, and description so the course product can be reviewed.
# DELETE after use and revoke the token.

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Gumroad access token'
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Query Gumroad API
        run: |
          echo "::add-mask::${{ inputs.token }}"
          curl -sS "https://api.gumroad.com/v2/products?access_token=${{ inputs.token }}" -o resp.json
          python3 - <<'PY'
          import json, re
          d = json.load(open('resp.json'))
          print("SUCCESS:", d.get("success"), "COUNT:", len(d.get("products", [])))
          for p in d.get("products", []):
              desc = re.sub(r'<[^>]+>', ' ', p.get("description") or "")   # strip HTML tags
              desc = re.sub(r'\s+', ' ', desc).strip()
              print("----")
              print("NAME:", p.get("name"))
              print("URL:", p.get("short_url"), "| price_cents:", p.get("price"), "| published:", p.get("published"))
              print("DESC(", len(desc), "chars):", desc[:600])
          PY
