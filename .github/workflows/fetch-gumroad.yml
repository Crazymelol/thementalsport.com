name: Fetch Gumroad Products (one-off)

# Temporary helper: this repo's assistant environment has no internet, so this
# runs on GitHub's runners (which do) to read the Gumroad product catalog via
# the API and print each product's public link. The token is passed as a
# dispatch input and masked in logs. DELETE this workflow after use and revoke
# the Gumroad token.

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Gumroad access token'
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Query Gumroad API
        run: |
          echo "::add-mask::${{ inputs.token }}"
          curl -sS "https://api.gumroad.com/v2/products?access_token=${{ inputs.token }}" -o resp.json
          python3 - <<'PY'
          import json
          d = json.load(open('resp.json'))
          print("SUCCESS:", d.get("success"))
          if not d.get("success"):
              print("MESSAGE:", d.get("message"))
          prods = d.get("products", [])
          print("COUNT:", len(prods))
          for p in prods:
              print("PRODUCT||", p.get("name"), "||", p.get("short_url"),
                    "||price=", p.get("price"), "||published=", p.get("published"),
                    "||id=", p.get("id"))
          PY
