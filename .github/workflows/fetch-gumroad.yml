name: Fetch Gumroad Products (one-off)

# Temporary helper: reads the Gumroad product catalog via the API (this repo's
# assistant environment has no internet). Token is a masked dispatch input.
# DELETE this workflow after use and revoke the token.

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Gumroad access token'
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Query Gumroad API
        run: |
          echo "::add-mask::${{ inputs.token }}"
          curl -sS "https://api.gumroad.com/v2/products?access_token=${{ inputs.token }}" -o resp.json
          python3 - <<'PY'
          import json
          d = json.load(open('resp.json'))
          print("SUCCESS:", d.get("success"))
          if not d.get("success"):
              print("MESSAGE:", d.get("message"))
          prods = d.get("products", [])
          print("COUNT:", len(prods))
          for p in prods:
              print("PRODUCT||", p.get("name"), "||", p.get("short_url"),
                    "||price=", p.get("price"), "||published=", p.get("published"))
          PY
