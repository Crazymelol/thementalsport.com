name: Gumroad Landing (one-off)

# Temporary helper: this assistant sandbox has no network to Gumroad and no CLI,
# so run the gumroad CLI on GitHub's runners to preview/publish the custom
# landing page. Token is a masked dispatch input. DELETE after use; revoke token.

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Gumroad access token'
        required: true
      mode:
        description: 'preview | publish | url | clear'
        required: true
        default: 'preview'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gumroad CLI
        run: |
          set +e
          curl -fsSL https://gumroad.com/install-cli.sh | bash
          for d in "$HOME/.local/bin" "$HOME/.gumroad/bin" /usr/local/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          export PATH="$HOME/.local/bin:$HOME/.gumroad/bin:/usr/local/bin:$PATH"
          command -v gumroad && gumroad --version || echo "gumroad not on PATH yet"

      - name: Discover CLI + run mode
        env:
          GUMROAD_ACCESS_TOKEN: ${{ inputs.token }}
          GUMROAD_TOKEN: ${{ inputs.token }}
          GUMROAD_API_KEY: ${{ inputs.token }}
        run: |
          echo "::add-mask::${{ inputs.token }}"
          export PATH="$HOME/.local/bin:$HOME/.gumroad/bin:/usr/local/bin:$PATH"
          set +e
          echo "===== help ====="
          gumroad --help 2>&1 | head -40
          echo "===== auth help ====="
          gumroad auth --help 2>&1 | head -30
          echo "===== auth status ====="
          gumroad auth status 2>&1 | head -10
          MODE="${{ inputs.mode }}"
          echo "===== MODE: $MODE ====="
          if [ "$MODE" = "preview" ]; then
            gumroad products page preview qjsfty ./landing.html --json --no-input --non-interactive 2>&1 | head -160
          elif [ "$MODE" = "publish" ]; then
            gumroad products page publish qjsfty ./landing.html --json --no-input --non-interactive 2>&1 | head -160
          elif [ "$MODE" = "url" ]; then
            gumroad products page url qjsfty --json --no-input --non-interactive 2>&1 | head -40
          elif [ "$MODE" = "clear" ]; then
            gumroad products page clear qjsfty --yes --json --no-input --non-interactive 2>&1 | head -40
          fi
